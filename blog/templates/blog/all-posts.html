{% extends "base.html" %}
{% load static %}

{% block title %}All Posts{% endblock %}

{% block css_files %}
    <link rel="stylesheet" href="{% static 'blog/post.css' %}">
    <link rel="stylesheet" href="{% static 'blog/all-posts.css' %}">
{% endblock %}

{% block content %}
<section id="all-posts">
    <h1>All Posts</h1>
    <ul>
        {% for post in all_posts %}
            {% include "blog/includes/posts.html" %}
        {% endfor %}
    </ul>
</section>
{% endblock %}
